<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸運戳戳樂抽獎系統</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #170f36 0%, #2b194d 50%, #131c38 100%);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.16);
      --accent-gold: #ffd166;
      --accent-gold-dark: #f4a261;
      --accent-pink: #ef476f;
      --accent-cyan: #06d6a0;
      --text-main: #ffffff;
      --text-muted: #c2bce0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    /* 防止數字與標籤異常斷行 */
    .nowrap {
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Top Header */
    header {
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 30;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .brand-icon {
      font-size: 28px;
      filter: drop-shadow(0 0 8px rgba(255, 209, 102, 0.5));
    }

    .brand h1 {
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(90deg, #ffd166, #ff9f1c, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px;
      border-radius: 999px;
      border: 1px solid var(--card-border);
      gap: 4px;
    }

    .nav-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .nav-tab:hover {
      color: #fff;
    }

    .nav-tab.active {
      background: linear-gradient(135deg, #ffd166, #f4a261);
      color: #1a103c;
      box-shadow: 0 3px 10px rgba(244, 162, 97, 0.35);
    }

    .tab-badge {
      background: rgba(0, 0, 0, 0.25);
      color: inherit;
      padding: 1px 7px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Cloud Sync Status Pill */
    .sync-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      background: rgba(6, 214, 160, 0.12);
      border: 1px solid rgba(6, 214, 160, 0.35);
      color: #06d6a0;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sync-pill:hover {
      background: rgba(6, 214, 160, 0.22);
    }

    .sync-pill.syncing {
      background: rgba(255, 209, 102, 0.15);
      border-color: rgba(255, 209, 102, 0.4);
      color: var(--accent-gold);
    }

    .sync-pill.offline {
      background: rgba(239, 71, 111, 0.15);
      border-color: rgba(239, 71, 111, 0.4);
      color: #ff8fa3;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 6px currentColor;
    }

    /* Call Number Quick Bar */
    .call-bar {
      display: flex;
      align-items: center;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 209, 102, 0.4);
      border-radius: 999px;
      padding: 3px 5px 3px 14px;
      gap: 6px;
      white-space: nowrap;
    }

    .call-bar input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.92rem;
      width: 82px;
      outline: none;
      font-weight: 700;
    }

    .call-bar input::placeholder {
      color: rgba(255, 255, 255, 0.55);
      font-weight: 400;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.2);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-gold {
      background: linear-gradient(135deg, #ffd166, #f4a261);
      color: #1a103c;
      border: none;
      box-shadow: 0 4px 14px rgba(244, 162, 97, 0.35);
    }

    .btn-gold:hover:not(:disabled) {
      background: linear-gradient(135deg, #ffe08a, #f6b079);
      box-shadow: 0 6px 18px rgba(244, 162, 97, 0.55);
    }

    .btn-pink {
      background: linear-gradient(135deg, #ef476f, #d90429);
      border: none;
      box-shadow: 0 4px 14px rgba(239, 71, 111, 0.35);
    }

    .btn-pink:hover:not(:disabled) {
      background: linear-gradient(135deg, #ff5c82, #ef233c);
    }

    /* View Containers */
    .view-section {
      display: none;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      padding: 22px 24px;
    }

    .view-section.active {
      display: block;
    }

    /* Game View Layout */
    .game-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 24px;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .game-layout {
        grid-template-columns: 1fr;
      }
    }

    /* Board Area */
    .board-section {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stat-group {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    .stat-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .stat-item strong {
      font-size: 1.2rem;
      color: var(--accent-gold);
      white-space: nowrap;
    }

    /* Grid Cells */
    .grid-board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 14px;
      align-content: start;
    }

    .cell {
      aspect-ratio: 1 / 1;
      perspective: 900px;
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .cell-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      border-radius: 18px;
    }

    .cell:not(.opened):hover .cell-inner {
      transform: translateY(-4px) scale(1.03);
    }

    /* Roulette Jump Spotlight Effect */
    .cell.roulette-active .cell-inner {
      transform: translateY(-6px) scale(1.08);
      box-shadow: 0 0 28px 6px #ffd166, 0 0 12px 2px #ffffff;
      z-index: 10;
    }

    .cell.roulette-active .cell-front {
      border-color: #ffffff;
      background: linear-gradient(145deg, #ff9f1c, #ef476f);
    }

    .cell.shaking .cell-inner {
      animation: shakeBox 0.45s ease-in-out;
    }

    @keyframes shakeBox {
      0%, 100% { transform: scale(1.06) rotate(0deg); }
      20% { transform: scale(1.1) rotate(-7deg); }
      40% { transform: scale(1.1) rotate(7deg); }
      60% { transform: scale(1.1) rotate(-5deg); }
      80% { transform: scale(1.1) rotate(5deg); }
    }

    .cell.opened .cell-inner {
      transform: rotateY(180deg);
    }

    .cell-front,
    .cell-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px 8px;
      text-align: center;
      overflow: hidden;
    }

    /* Unopened Box Styling */
    .cell-front {
      background: linear-gradient(145deg, #e63946, #9d1785);
      border: 2px solid rgba(255, 209, 102, 0.65);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35), inset 0 2px 6px rgba(255, 255, 255, 0.28);
    }

    .cell-front::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 100%;
      background: rgba(255, 209, 102, 0.2);
      pointer-events: none;
    }

    .cell-front::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 16px;
      background: rgba(255, 209, 102, 0.2);
      pointer-events: none;
    }

    .cell-number {
      position: relative;
      z-index: 2;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff3b0, #ffd166 60%, #e09f3e 100%);
      color: #3d0c11;
      font-size: 1.35rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.35);
      border: 2px solid #fff;
      white-space: nowrap;
    }

    .cell-hint {
      position: relative;
      z-index: 2;
      margin-top: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.92);
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      white-space: nowrap;
    }

    /* Opened Box Styling */
    .cell-back {
      transform: rotateY(180deg);
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(6px);
      justify-content: space-between;
      padding: 8px 6px;
    }

    .cell.opened.is-grand .cell-back {
      background: linear-gradient(145deg, rgba(255, 209, 102, 0.3), rgba(239, 71, 111, 0.3));
      border: 2px solid var(--accent-gold);
      box-shadow: 0 0 18px rgba(255, 209, 102, 0.35);
    }

    .cell-back-top {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
    }

    .cell-back-num {
      font-size: 0.72rem;
      font-weight: 800;
      color: var(--text-muted);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .cell-back-icon {
      font-size: 1.25rem;
      line-height: 1;
    }

    .cell-back-prize {
      font-size: 0.84rem;
      font-weight: 800;
      line-height: 1.25;
      color: #fff;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      width: 100%;
      padding: 0 2px;
    }

    .cell.opened.is-grand .cell-back-prize {
      color: var(--accent-gold);
    }

    .cell-back-winner {
      font-size: 0.74rem;
      font-weight: 700;
      color: #06d6a0;
      background: rgba(0, 0, 0, 0.45);
      padding: 2px 8px;
      border-radius: 99px;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Sidebar Prize Status & Winner List */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .panel-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .panel-title {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
      white-space: nowrap;
      gap: 8px;
    }

    .prize-status-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 250px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .prize-status-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.25);
      font-size: 0.88rem;
    }

    .prize-status-item.exhausted {
      opacity: 0.45;
      text-decoration: line-through;
    }

    .prize-name-text {
      font-weight: 700;
      flex: 1;
      min-width: 0;
    }

    .prize-badge {
      font-size: 0.78rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 99px;
      background: rgba(255, 209, 102, 0.2);
      color: var(--accent-gold);
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Current Round Winner List */
    .round-winners-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .winner-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.86rem;
    }

    .winner-row.grand {
      border-left: 3px solid var(--accent-gold);
      background: rgba(255, 209, 102, 0.1);
    }

    .winner-row-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .winner-num-pill {
      font-weight: 900;
      color: var(--accent-gold);
      background: rgba(0, 0, 0, 0.35);
      padding: 2px 7px;
      border-radius: 6px;
      white-space: nowrap;
      flex-shrink: 0;
      font-size: 0.8rem;
    }

    .winner-info-col {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .winner-prize-label {
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .winner-player-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 0.78rem;
      color: #06d6a0;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .winner-player-tag:hover {
      text-decoration: underline;
    }

    /* ============================================
       Play Records Tab View (以「整局」為單位的紀錄分頁)
       ============================================ */
    .records-header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px 22px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .records-filter-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .sessions-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .session-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      overflow: hidden;
      transition: border-color 0.2s ease;
    }

    .session-card.current-session {
      border: 2px solid rgba(255, 209, 102, 0.65);
      box-shadow: 0 8px 26px rgba(0, 0, 0, 0.3);
    }

    .session-card-header {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.28);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      cursor: pointer;
      user-select: none;
    }

    .session-card-header:hover {
      background: rgba(0, 0, 0, 0.38);
    }

    .session-title-group {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .session-round-badge {
      background: linear-gradient(135deg, #ffd166, #f4a261);
      color: #1a103c;
      font-weight: 900;
      font-size: 0.92rem;
      padding: 4px 14px;
      border-radius: 99px;
      white-space: nowrap;
    }

    .session-status-badge {
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .session-status-badge.active {
      background: rgba(6, 214, 160, 0.18);
      color: #06d6a0;
      border: 1px solid rgba(6, 214, 160, 0.4);
    }

    .session-status-badge.completed {
      background: rgba(255, 209, 102, 0.18);
      color: var(--accent-gold);
      border: 1px solid rgba(255, 209, 102, 0.4);
    }

    .session-meta-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .session-card-body {
      padding: 18px 20px;
      border-top: 1px solid var(--card-border);
      display: none;
    }

    .session-card.expanded .session-card-body {
      display: block;
    }

    .session-filter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .records-table-wrap {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      overflow-x: auto;
    }

    table.records-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 620px;
    }

    table.records-table th,
    table.records-table td {
      padding: 11px 14px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      font-size: 0.9rem;
    }

    table.records-table th {
      background: rgba(0, 0, 0, 0.35);
      color: var(--accent-gold);
      font-weight: 800;
      white-space: nowrap;
    }

    table.records-table tr:hover td {
      background: rgba(255, 255, 255, 0.04);
    }

    .record-type-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 99px;
      font-size: 0.76rem;
      font-weight: 800;
      white-space: nowrap;
    }

    .record-type-badge.grand {
      background: rgba(255, 209, 102, 0.2);
      color: var(--accent-gold);
      border: 1px solid rgba(255, 209, 102, 0.45);
    }

    .record-type-badge.normal {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
    }

    .inline-player-input {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      padding: 6px 10px;
      color: #fff;
      font-size: 0.88rem;
      width: 160px;
      outline: none;
    }

    .inline-player-input:focus {
      border-color: var(--accent-gold);
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(10, 6, 24, 0.8);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 20px;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Winner Popup Modal */
    .winner-modal {
      background: linear-gradient(155deg, #2b194d 0%, #18102c 100%);
      border: 2px solid var(--accent-gold);
      border-radius: 28px;
      max-width: 480px;
      width: 100%;
      padding: 32px 26px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 40px rgba(255, 209, 102, 0.3);
      transform: scale(0.85);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      position: relative;
    }

    .modal-backdrop.active .winner-modal {
      transform: scale(1);
    }

    .winner-number-tag {
      display: inline-block;
      background: rgba(255, 209, 102, 0.18);
      color: var(--accent-gold);
      border: 1px solid rgba(255, 209, 102, 0.5);

  <script>
    const STORAGE_KEY = 'LUCKY_DRAW_STATE_V3';
    const DEFAULT_CLOUD_ROOM = 'nono86433_lucky_draw_v1';

    const defaultConfig = {
      totalCells: 25,
      consolationName: '銘謝惠顧',
      prizes: [
        { id: 'p1', name: '👑 頭獎：iPhone 16 Pro', count: 1 },
        { id: 'p2', name: '🥈 貳獎：Switch 遊戲機', count: 2 },
        { id: 'p3', name: '🥉 參獎：現金禮券 1,000 元', count: 3 },
        { id: 'p4', name: '🧧 特別獎：精緻下午茶券', count: 5 }
      ]
    };

    /**
     * 資料結構設計：
     * - gameSessions: 儲存每一整局的完整紀錄陣列（最新局排最前面）
     *   每個 session 物件包含：
     *   {
     *     sessionId: 'sess_...',
     *     roundNumber: 1,
     *     startedAt: '2026/11/08 23:20:00',
     *     completedAt: '' | '2026/11/08 23:35:00',
     *     totalCells: 25,
     *     cells: [ { number, prizeName, isGrand, prizeId, opened, winnerName, openedAt } ]
     *   }
     */
    let state = {
      version: 3,
      updatedAt: 0,
      roundNumber: 1,
      currentSessionId: '',
      cloudRoom: DEFAULT_CLOUD_ROOM,
      config: JSON.parse(JSON.stringify(defaultConfig)),
      cells: [],
      gameSessions: [],
      soundEnabled: true
    };

    // 記錄哪些局數卡片在「遊玩紀錄」分頁中處於展開狀態
    const expandedSessionIds = new Set();
    let showOnlyOpenedInSession = {}; // { [sessionId]: boolean }

    let currentEditingSessionId = null;
    let currentEditingCellNumber = null;
    let isAnimating = false;
    let cloudSocket = null;

    // ==========================================
    // 音效合成器 (Web Audio API)
    // ==========================================
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!state.soundEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      if (type === 'tick') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(680, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.008, now + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      } else if (type === 'drum') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.35);
        gain.gain.setValueAtTime(0.18, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.35);
      } else if (type === 'grand') {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.22, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.008, now + idx * 0.08 + 0.65);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.65);
        });
      } else if (type === 'normal') {
        const notes = [392.00, 329.63];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.1);
          gain.gain.setValueAtTime(0.15, now + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.01, now + idx * 0.1 + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.1);
          osc.stop(now + idx * 0.1 + 0.3);
        });
      }
    }

    // ==========================================
    // 雲端同步機制 (ntfy.sh JSON 狀態儲存 + 即時監聽)
    // ==========================================
    function setSyncBadge(status, text) {
      const pill = document.getElementById('cloudSyncPill');
      const label = document.getElementById('cloudSyncText');
      pill.className = 'sync-pill ' + (status === 'syncing' ? 'syncing' : status === 'offline' ? 'offline' : '');
      label.textContent = text;
    }

    function getCloudTopic() {
      const clean = (state.cloudRoom || DEFAULT_CLOUD_ROOM).replace(/[^a-zA-Z0-9_-]/g, '_');
      return `lucky_draw_sync_v3_${clean}`;
    }

    function syncCurrentCellsIntoSession() {
      const idx = state.gameSessions.findIndex(s => s.sessionId === state.currentSessionId);
      if (idx !== -1) {
        state.gameSessions[idx].cells = JSON.parse(JSON.stringify(state.cells));
        const allOpened = state.cells.length > 0 && state.cells.every(c => c.opened);
        if (allOpened && !state.gameSessions[idx].completedAt) {
          state.gameSessions[idx].completedAt = formatDateTime(new Date());
        }
      }
    }

    async function pushStateToCloud() {
      syncCurrentCellsIntoSession();
      state.updatedAt = Date.now();
      saveLocalState();
      const topic = getCloudTopic();
      setSyncBadge('syncing', '雲端同步中...');
      try {
        const payload = {
          type: 'FULL_STATE_V3',
          updatedAt: state.updatedAt,
          roundNumber: state.roundNumber,
          currentSessionId: state.currentSessionId,
          config: state.config,
          cells: state.cells,
          gameSessions: state.gameSessions
        };
        await fetch(`https://ntfy.sh/${topic}`, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        setSyncBadge('ok', '雲端已同步');
      } catch (err) {
        console.warn('Cloud push error:', err);
        setSyncBadge('offline', '離線本機模式');
      }
    }

    async function pullStateFromCloud(forceApply = false) {
      const topic = getCloudTopic();
      setSyncBadge('syncing', '讀取雲端資料...');
      try {
        const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=all&_t=${Date.now()}`, {
          cache: 'no-store'
        });
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        let latestCloudState = null;

        for (const line of lines) {
          try {
            const msg = JSON.parse(line);
            if (msg.event === 'message' && msg.message) {
              const parsed = JSON.parse(msg.message);
              if (parsed && parsed.type === 'FULL_STATE_V3' && Array.isArray(parsed.cells)) {
                if (!latestCloudState || (parsed.updatedAt || 0) >= (latestCloudState.updatedAt || 0)) {
                  latestCloudState = parsed;
                }
              }
            }
          } catch (e) {}
        }

        if (latestCloudState) {
          if (forceApply || (latestCloudState.updatedAt || 0) > (state.updatedAt || 0)) {
            applyRemoteState(latestCloudState);
          }
          setSyncBadge('ok', '雲端已同步');
        } else {
          await pushStateToCloud();
        }
      } catch (err) {
        console.warn('Cloud pull error:', err);
        setSyncBadge('offline', '離線本機模式');
      }
    }

    function applyRemoteState(remote) {
      state.updatedAt = remote.updatedAt || Date.now();
      state.roundNumber = remote.roundNumber || 1;
      state.currentSessionId = remote.currentSessionId || '';
      if (remote.config) state.config = remote.config;
      if (Array.isArray(remote.cells)) state.cells = remote.cells;
      if (Array.isArray(remote.gameSessions)) state.gameSessions = remote.gameSessions;
      if (state.currentSessionId) {
        expandedSessionIds.add(state.currentSessionId);
      }
      saveLocalState();
      renderAll();
    }

    function connectCloudWebSocket() {
      if (cloudSocket) {
        try { cloudSocket.close(); } catch (e) {}
      }
      const topic = getCloudTopic();
      try {
        cloudSocket = new WebSocket(`wss://ntfy.sh/${topic}/ws`);
        cloudSocket.onopen = () => {
          setSyncBadge('ok', '雲端已同步');
        };
        cloudSocket.onmessage = (event) => {
          try {
            const raw = JSON.parse(event.data);
            if (raw.event === 'message' && raw.message) {
              const data = JSON.parse(raw.message);
              if (data && data.type === 'FULL_STATE_V3' && (data.updatedAt || 0) > (state.updatedAt || 0)) {
                applyRemoteState(data);
              }
            }
          } catch (e) {}
        };
        cloudSocket.onclose = () => {
          setTimeout(connectCloudWebSocket, 5000);
        };
      } catch (e) {}
    }

    // ==========================================
    // 遊戲核心邏輯（以「整局」為單位建立與保存紀錄）
    // ==========================================
    function formatDateTime(d) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function formatShortTime(d) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function startNewRoundSession(config, isFirstInit = false) {
      // 如果上一局完全還沒開過任何一格，直接覆蓋更新當前這一局即可，避免產生空白廢局
      const currentSession = state.gameSessions.find(s => s.sessionId === state.currentSessionId);
      const currentOpenedCount = state.cells.filter(c => c.opened).length;

      state.config = JSON.parse(JSON.stringify(config));

      const pool = [];
      state.config.prizes.forEach((p) => {
        const count = Math.max(0, parseInt(p.count, 10) || 0);
        for (let i = 0; i < count; i++) {
          pool.push({
            prizeName: p.name.trim() || '神秘大獎',
            isGrand: true,
            prizeId: p.id
          });
        }
      });

      const total = Math.max(1, parseInt(state.config.totalCells, 10) || 25);
      const consolationText = (state.config.consolationName || '銘謝惠顧').trim();

      while (pool.length < total) {
        pool.push({
          prizeName: consolationText,
          isGrand: false,
          prizeId: null
        });
      }

      const trimmedPool = pool.slice(0, total);
      const shuffled = shuffleArray(trimmedPool);

      const newCells = shuffled.map((item, idx) => ({
        number: idx + 1,
        prizeName: item.prizeName,
        isGrand: item.isGrand,
        prizeId: item.prizeId,
        opened: false,
        winnerName: '',
        openedAt: ''
      }));

      state.cells = newCells;

      if (!isFirstInit && currentSession && currentOpenedCount === 0) {
        // 當前局一格都還沒抽過，直接重新洗牌當前局
        currentSession.startedAt = formatDateTime(new Date());
        currentSession.totalCells = total;
        currentSession.cells = JSON.parse(JSON.stringify(newCells));
      } else {
        // 如果上一局有抽過，先將上一局封存，並建立新的一局紀錄
        if (currentSession && !currentSession.completedAt) {
          currentSession.completedAt = formatDateTime(new Date());
        }

        const maxRound = state.gameSessions.reduce((max, s) => Math.max(max, s.roundNumber || 0), 0);
        const nextRound = isFirstInit && state.gameSessions.length === 0 ? 1 : maxRound + 1;
        const newSessionId = `sess_${Date.now()}_r${nextRound}`;

        state.roundNumber = nextRound;
        state.currentSessionId = newSessionId;

        const newSessionObj = {
          sessionId: newSessionId,
          roundNumber: nextRound,
          startedAt: formatDateTime(new Date()),
          completedAt: '',
          totalCells: total,
          cells: JSON.parse(JSON.stringify(newCells))
        };

        state.gameSessions.unshift(newSessionObj);
        expandedSessionIds.add(newSessionId);
      }

      renderAll();
      pushStateToCloud();
    }

    function saveLocalState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn('無法儲存至 localStorage', e);
      }
    }

    async function loadInitialState() {
      let hasLocal = false;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.config && Array.isArray(parsed.cells) && parsed.cells.length > 0 && Array.isArray(parsed.gameSessions)) {
            state = {
              ...state,
              ...parsed
            };
            if (state.currentSessionId) {
              expandedSessionIds.add(state.currentSessionId);
            }
            hasLocal = true;
          }
        }
      } catch (e) {}

      if (!hasLocal) {
        state.updatedAt = 0;
        startNewRoundSession(defaultConfig, true);
        state.updatedAt = 0;
      } else {
        renderAll();
      }

      await pullStateFromCloud(false);
      connectCloudWebSocket();
    }

      document.getElementById('statTotal').textContent = total;

      document.getElementById('statGrandRemaining').textContent = grandRemaining;
    }

    // 渲染「各局遊玩紀錄」分頁（每一整局一張可展開卡片）
    function renderSessionsView() {
      syncCurrentCellsIntoSession();
      const container = document.getElementById('sessionsContainer');
      const keyword = (document.getElementById('recordSearchInput')?.value || '').trim().toLowerCase();

      if (!state.gameSessions || state.gameSessions.length === 0) {
        container.innerHTML = `
          <div class="panel-card" style="text-align: center; color: var(--text-muted); padding: 36px;">
            目前尚無任何局數紀錄
          </div>
        `;
        return;
      }

      container.innerHTML = '';

      state.gameSessions.forEach((sess) => {
        const isCurrent = sess.sessionId === state.currentSessionId;
        const cells = Array.isArray(sess.cells) ? sess.cells : [];
        const openedCount = cells.filter(c => c.opened).length;
        const grandOpenedCount = cells.filter(c => c.opened && c.isGrand).length;
        const grandTotalCount = cells.filter(c => c.isGrand).length;
        const isAllOpened = cells.length > 0 && openedCount === cells.length;

        // 若有搜尋關鍵字，過濾該局內的格子
        const matchingCells = cells.filter((c) => {
          if (!keyword) return true;
          return (
            (c.prizeName || '').toLowerCase().includes(keyword) ||
            (c.winnerName || '').toLowerCase().includes(keyword) ||
            String(c.number).includes(keyword)
          );
        });

        if (keyword && matchingCells.length === 0) {
          return;
        }

        const isExpanded = expandedSessionIds.has(sess.sessionId) || Boolean(keyword);
        const onlyOpened = showOnlyOpenedInSession[sess.sessionId] !== false; // 預設只顯示已開出的格子，可切換顯示全部格子
        const displayCells = onlyOpened ? matchingCells.filter(c => c.opened) : matchingCells;

        const card = document.createElement('div');
        card.className = `session-card ${isCurrent ? 'current-session' : ''} ${isExpanded ? 'expanded' : ''}`;

        const statusBadgeHtml = isCurrent && !isAllOpened
          ? `<span class="session-status-badge active">🟢 目前進行中</span>`
          : `<span class="session-status-badge completed">✅ 已完成 / 已封存</span>`;

        card.innerHTML = `
          <div class="session-card-header">
            <div class="session-title-group">
              <span class="session-round-badge">第 ${sess.roundNumber} 局</span>
              ${statusBadgeHtml}
              <span class="nowrap" style="font-weight: 800; color: #fff;">
                已抽 ${openedCount} / ${cells.length} 格（大獎已出 ${grandOpenedCount} / ${grandTotalCount}）
              </span>
            </div>
            <div class="session-meta-group">
              <span class="nowrap">🕒 開局時間：${escapeHtml(sess.startedAt || '')}</span>
              ${!isCurrent ? `<button type="button" class="btn-icon delete-session-btn" title="刪除第 ${sess.roundNumber} 局整局紀錄">🗑️</button>` : ''}
              <span class="nowrap" style="color: var(--accent-gold); font-weight: 800;">
                ${isExpanded ? '▲ 收合明細' : '▼ 展開整局明細'}
              </span>
            </div>
          </div>

          <div class="session-card-body">
            <div class="session-filter-row">
              <div style="font-size: 0.88rem; color: var(--text-muted);">
                📋 <strong>第 ${sess.roundNumber} 局完整結果清單</strong>（可直接修改該局得主姓名）
              </div>
              <div style="display: flex; gap: 8px; align-items: center;">
                <button type="button" class="btn toggle-unopened-btn" style="padding: 5px 12px; font-size: 0.82rem;">
                  ${onlyOpened ? `👁️ 顯示全部 ${cells.length} 格（含未開）` : `👁️ 僅顯示已開出 (${openedCount} 格)`}
                </button>
              </div>
            </div>

            <div class="records-table-wrap">
              <table class="records-table">
                <thead>
                  <tr>
                    <th>格號</th>
                    <th>狀態</th>
                    <th>類型</th>
                    <th>獎勵內容</th>
                    <th>得主姓名（可直接輸入紀錄）</th>
                    <th>開出時間</th>
                  </tr>
                </thead>
                <tbody class="session-tbody"></tbody>
              </table>
            </div>
          </div>
        `;

        // 點擊標題列展開/收合整局明細
        const headerEl = card.querySelector('.session-card-header');
        headerEl.addEventListener('click', (e) => {
          if (e.target.closest('.delete-session-btn')) return;
          if (expandedSessionIds.has(sess.sessionId)) {
            expandedSessionIds.delete(sess.sessionId);
          } else {
            expandedSessionIds.add(sess.sessionId);
          }
          renderSessionsView();
        });

        // 刪除整局紀錄按鈕
        const delBtn = card.querySelector('.delete-session-btn');
        if (delBtn) {
          delBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (confirm(`確定要永久刪除「第 ${sess.roundNumber} 局」的整局遊玩紀錄嗎？`)) {
              state.gameSessions = state.gameSessions.filter(s => s.sessionId !== sess.sessionId);
              expandedSessionIds.delete(sess.sessionId);
              renderAll();
              pushStateToCloud();
            }
          });
        }

        // 切換是否顯示未開啟格子
        const toggleBtn = card.querySelector('.toggle-unopened-btn');
        toggleBtn.addEventListener('click', () => {
          showOnlyOpenedInSession[sess.sessionId] = !onlyOpened;
          renderSessionsView();
        });

        // 填入該局每一格的資料列
        const tbody = card.querySelector('.session-tbody');
        if (displayCells.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 20px;">
                本局目前尚無已開出的格子（可點擊右上角「顯示全部格子」檢視）
              </td>
            </tr>
          `;
        } else {
          displayCells.forEach((cell) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="nowrap"><strong>#${cell.number}</strong></td>
              <td class="nowrap">
                ${cell.opened
                  ? `<span style="color: #06d6a0; font-weight: 800;">✅ 已開出</span>`
                  : `<span style="color: var(--text-muted);">🔒 未開啟</span>`
                }
              </td>
              <td class="nowrap">
                <span class="record-type-badge ${cell.isGrand ? 'grand' : 'normal'}">
                  ${cell.isGrand ? '🏆 大獎' : '🎈 一般'}
                </span>
              </td>
              <td style="font-weight: 700; color: ${cell.isGrand ? 'var(--accent-gold)' : '#fff'};">
                ${escapeHtml(cell.prizeName)}
              </td>
              <td>
                <input type="text" class="inline-player-input" value="${escapeHtml(cell.winnerName || '')}" placeholder="輸入得主名字...">
              </td>
              <td class="nowrap" style="color: var(--text-muted); font-size: 0.84rem;">
                ${escapeHtml(cell.openedAt || '-')}
              </td>
            `;

            const inputEl = tr.querySelector('.inline-player-input');
            inputEl.addEventListener('change', () => {
              updateSessionCellWinner(sess.sessionId, cell.number, inputEl.value.trim());
            });

            tbody.appendChild(tr);
          });
        }

        container.appendChild(card);
      });
    }

    function updateSessionCellWinner(sessionId, cellNumber, newName) {
      const sess = state.gameSessions.find(s => s.sessionId === sessionId);
      if (sess && Array.isArray(sess.cells)) {
        const target = sess.cells.find(c => c.number === cellNumber);
        if (target) target.winnerName = newName;
      }

      if (sessionId === state.currentSessionId) {
        const curCell = state.cells.find(c => c.number === cellNumber);
        if (curCell) curCell.winnerName = newName;
      }

      renderAll();
      pushStateToCloud();
    }

    // ==========================================
    // 開獎與隨機跳號輪盤動畫
    // ==========================================
    function triggerOpenCell(number) {
      if (isAnimating) return;
      const cell = state.cells.find(c => c.number === number);
      if (!cell) {
        alert(`找不到第 ${number} 號格子！請輸入 1 ~ ${state.cells.length} 之間的號碼。`);
        return;
      }

      if (cell.opened) {
        showWinnerModal(cell, state.currentSessionId);
        return;
      }

      isAnimating = true;
      const cellEl = document.getElementById(`cell-${number}`);
      if (cellEl) {
        cellEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
        cellEl.classList.add('shaking');
      }

      playSound('drum');

      setTimeout(() => {
        const now = new Date();
        cell.opened = true;
        cell.openedAt = formatShortTime(now);

        if (cellEl) {
          cellEl.classList.remove('shaking');
          cellEl.classList.add('opened');
        }

        syncCurrentCellsIntoSession();
        renderAll();
        pushStateToCloud();

        setTimeout(() => {
          showWinnerModal(cell, state.currentSessionId);
          isAnimating = false;
        }, 280);
      }, 420);
    }

    // 隨機跳號輪盤動畫
    function startRouletteRandomPick() {
      if (isAnimating) return;
      const unopened = state.cells.filter(c => !c.opened);
      if (unopened.length === 0) {
        if (confirm('🎉 本局所有格子都已經全數抽完囉！\n是否要立即開啟下一局（本局完整紀錄會保存在「各局遊玩紀錄」分頁中）？')) {
          startNewRoundSession(state.config, false);
        }
        return;
      }

      if (unopened.length === 1) {
        triggerOpenCell(unopened[0].number);
        return;
      }

      isAnimating = true;
      const targetCell = unopened[Math.floor(Math.random() * unopened.length)];
      const totalSteps = 22;
      let currentStep = 0;
      let activeHighlightEl = null;

      function stepRoulette() {
        if (activeHighlightEl) {
          activeHighlightEl.classList.remove('roulette-active');
        }

        let pickCell;
        if (currentStep === totalSteps) {
          pickCell = targetCell;
        } else {
          pickCell = unopened[Math.floor(Math.random() * unopened.length)];
        }

        const el = document.getElementById(`cell-${pickCell.number}`);
        if (el) {
          el.classList.add('roulette-active');
          activeHighlightEl = el;
        }

        playSound('tick');

        if (currentStep < totalSteps) {
          currentStep++;
          const delay = Math.floor(45 + Math.pow(currentStep / totalSteps, 2.2) * 240);
          setTimeout(stepRoulette, delay);
        } else {
          setTimeout(() => {
            if (activeHighlightEl) {
              activeHighlightEl.classList.remove('roulette-active');
            }
            isAnimating = false;
            triggerOpenCell(targetCell.number);
          }, 350);
        }
      }

      stepRoulette();
    }

    // ==========================================
    // 中獎彈窗與玩家姓名綁定
    // ==========================================
    function showWinnerModal(cell, sessionId) {
      currentEditingSessionId = sessionId || state.currentSessionId;
      currentEditingCellNumber = cell.number;

      const backdrop = document.getElementById('winnerModalBackdrop');
      const card = document.getElementById('winnerModalCard');
      const numTag = document.getElementById('winnerNumberTag');
      const icon = document.getElementById('winnerIcon');
      const subtitle = document.getElementById('winnerSubtitle');
      const prizeName = document.getElementById('winnerPrizeName');
      const playerInput = document.getElementById('winnerPlayerInput');

      numTag.textContent = `第 ${state.roundNumber} 局 - 第 ${cell.number} 號格`;
      prizeName.textContent = cell.prizeName;
      playerInput.value = cell.winnerName || '';

      if (cell.isGrand) {
        card.classList.remove('consolation');
        icon.textContent = '🎊';
        subtitle.textContent = '🎉 恭喜抽中大獎！';
        playSound('grand');
        launchConfetti();
      } else {
        card.classList.add('consolation');
        icon.textContent = '🎈';
        subtitle.textContent = '開獎結果';
        playSound('normal');
      }

      backdrop.classList.add('active');
      setTimeout(() => playerInput.focus(), 120);
    }

    function saveWinnerAndCloseModal() {
      const playerInput = document.getElementById('winnerPlayerInput');
      const playerName = playerInput.value.trim();

      if (currentEditingCellNumber !== null) {
        updateSessionCellWinner(
          currentEditingSessionId || state.currentSessionId,
          currentEditingCellNumber,
          playerName
        );
      }

      document.getElementById('winnerModalBackdrop').classList.remove('active');
      currentEditingSessionId = null;
      currentEditingCellNumber = null;

      // 若本局已經全部抽完，貼心提醒可開啟下一局
      const unopenedCount = state.cells.filter(c => !c.opened).length;
      if (unopenedCount === 0) {
        setTimeout(() => {
          if (confirm('🎊 恭喜！第 ' + state.roundNumber + ' 局的所有格子已全部抽完！\n本局完整紀錄已保存在「各局遊玩紀錄」分頁中。\n\n是否要立即洗牌開啟下一局？')) {
            startNewRoundSession(state.config, false);
          }
        }, 250);
      }
    }

    // ==========================================
    // 彩帶特效 (Canvas)
    // ==========================================
    let confettiParticles = [];
    let confettiAnimId = null;

    function launchConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#ffd166', '#ef476f', '#06d6a0', '#118ab2', '#ffffff', '#ff9f1c'];
      confettiParticles = [];

      for (let i = 0; i < 110; i++) {
        confettiParticles.push({
          x: canvas.width / 2 + (Math.random() - 0.5) * 180,
          y: canvas.height * 0.45,
          vx: (Math.random() - 0.5) * 18,
          vy: -(Math.random() * 14 + 6),
          size: Math.random() * 9 + 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          vr: (Math.random() - 0.5) * 12,
          gravity: 0.35
        });
      }

      if (confettiAnimId) cancelAnimationFrame(confettiAnimId);

      function updateConfetti() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let activeCount = 0;

        confettiParticles.forEach((p) => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += p.gravity;
          p.rotation += p.vr;

          if (p.y < canvas.height + 30) {
            activeCount++;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();
          }
        });

        if (activeCount > 0) {
          confettiAnimId = requestAnimationFrame(updateConfetti);
        } else {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
      }

      updateConfetti();
    }

    // ==========================================
    // 設定視窗與 CSV 匯出
    // ==========================================
    function openSettingsModal() {
      document.getElementById('inputTotalCells').value = state.config.totalCells;
      document.getElementById('inputConsolationName').value = state.config.consolationName;
      document.getElementById('inputCloudRoom').value = state.cloudRoom || DEFAULT_CLOUD_ROOM;

      const container = document.getElementById('prizeRowsContainer');
      container.innerHTML = '';

      state.config.prizes.forEach((p) => {
        appendPrizeEditorRow(p.name, p.count);
      });

      if (state.config.prizes.length === 0) {
        appendPrizeEditorRow('頭獎：神秘大禮', 1);
      }

      updateAllocationSummary();
      document.getElementById('settingsModalBackdrop').classList.add('active');
    }

    function appendPrizeEditorRow(name = '', count = 1) {
      const container = document.getElementById('prizeRowsContainer');
      const row = document.createElement('div');
      row.className = 'prize-row';

      row.innerHTML = `
        <input type="text" class="form-control prize-name-input" placeholder="請輸入獎項名稱（如：頭獎 Switch）" value="${escapeHtml(name)}">
        <input type="number" class="form-control prize-count-input" min="1" max="300" value="${count}" title="獎項數量">
        <button type="button" class="btn-icon remove-prize-btn" title="刪除此獎項">🗑️</button>
      `;

      row.querySelector('.prize-name-input').addEventListener('input', updateAllocationSummary);
      row.querySelector('.prize-count-input').addEventListener('input', updateAllocationSummary);
      row.querySelector('.remove-prize-btn').addEventListener('click', () => {
        row.remove();
        updateAllocationSummary();
      });

      container.appendChild(row);
    }

    function updateAllocationSummary() {
      const totalCells = parseInt(document.getElementById('inputTotalCells').value, 10) || 0;
      const countInputs = document.querySelectorAll('.prize-count-input');
      let grandTotal = 0;

      countInputs.forEach((input) => {
        const val = parseInt(input.value, 10) || 0;
        if (val > 0) grandTotal += val;
      });

      const summaryEl = document.getElementById('allocationSummary');
      const diff = totalCells - grandTotal;

      if (diff < 0) {
        summaryEl.classList.add('error');
        summaryEl.innerHTML = `
          <span>⚠️ 大獎總數量 (${grandTotal} 個) 超過格子總數 (${totalCells} 格)！</span>
          <span>請增加總格數或減少獎項數量</span>
        `;
      } else {
        summaryEl.classList.remove('error');
        summaryEl.innerHTML = `
          <span class="nowrap">🎁 大獎總數：<strong>${grandTotal}</strong> 格</span>
          <span class="nowrap">🎈 安慰獎數量：<strong>${diff}</strong> 格</span>
          <span class="nowrap">📦 總計：<strong>${totalCells}</strong> 格</span>
        `;
      }
    }

    function saveSettingsAndStart() {
      const totalCells = parseInt(document.getElementById('inputTotalCells').value, 10);
      if (!totalCells || totalCells < 1 || totalCells > 300) {
        alert('請輸入有效的格子數量（1 ~ 300 之間）！');
        return;
      }

      const consolationName = document.getElementById('inputConsolationName').value.trim() || '銘謝惠顧';
      const newRoom = document.getElementById('inputCloudRoom').value.trim() || DEFAULT_CLOUD_ROOM;
      const rows = document.querySelectorAll('#prizeRowsContainer .prize-row');
      const newPrizes = [];
      let grandTotal = 0;

      rows.forEach((row, idx) => {
        const name = row.querySelector('.prize-name-input').value.trim();
        const count = parseInt(row.querySelector('.prize-count-input').value, 10) || 0;
        if (name && count > 0) {
          newPrizes.push({
            id: `p_${Date.now()}_${idx}`,
            name,
            count
          });
          grandTotal += count;
        }
      });

      if (grandTotal > totalCells) {
        alert(`大獎總數量 (${grandTotal} 個) 不能超過抽獎總格子數 (${totalCells} 格)！`);
        return;
      }

      const roomChanged = state.cloudRoom !== newRoom;
      state.cloudRoom = newRoom;
      if (roomChanged) {
        connectCloudWebSocket();
      }

      startNewRoundSession({
        totalCells,
        consolationName,
        prizes: newPrizes
      }, false);

      document.getElementById('settingsModalBackdrop').classList.remove('active');
    }

    function exportRecordsToCsv() {
      syncCurrentCellsIntoSession();
      if (!state.gameSessions || state.gameSessions.length === 0) {
        alert('目前尚無任何局數紀錄可匯出！');
        return;
      }

      const headers = ['局數', '開局時間', '格號', '狀態', '類型', '獎勵內容', '得主姓名', '開出時間'];
      const rows = [];

      state.gameSessions.forEach((sess) => {
        (sess.cells || []).forEach((c) => {
          rows.push([
            `"第 ${sess.roundNumber} 局"`,
            `"${(sess.startedAt || '').replace(/"/g, '""')}"`,
            `"#${c.number}"`,
            `"${c.opened ? '已開出' : '未開啟'}"`,
            `"${c.isGrand ? '大獎' : '一般'}"`,
            `"${(c.prizeName || '').replace(/"/g, '""')}"`,
            `"${(c.winnerName || '').replace(/"/g, '""')}"`,
            `"${(c.openedAt || '').replace(/"/g, '""')}"`
          ]);
        });
      });

      const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(e => e.join(','))].join('\r\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `抽獎各局完整紀錄_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function updateSoundButton() {
      const btn = document.getElementById('soundToggleBtn');
      btn.textContent = state.soundEnabled ? '🔊 音效：開' : '🔇 音效：關';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ==========================================
    // 事件綁定
    // ==========================================
    document.getElementById('tabBtnGame').addEventListener('click', () => {
      document.getElementById('tabBtnGame').classList.add('active');
      document.getElementById('tabBtnRecords').classList.remove('active');
      document.getElementById('viewGame').classList.add('active');
      document.getElementById('viewRecords').classList.remove('active');
    });

    document.getElementById('tabBtnRecords').addEventListener('click', () => {
      document.getElementById('tabBtnRecords').classList.add('active');
      document.getElementById('tabBtnGame').classList.remove('active');
      document.getElementById('viewRecords').classList.add('active');
      document.getElementById('viewGame').classList.remove('active');
      renderSessionsView();
    });

    document.getElementById('confirmWinnerBtn').addEventListener('click', saveWinnerAndCloseModal);
    document.getElementById('winnerPlayerInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') saveWinnerAndCloseModal();
    });
    document.getElementById('winnerModalBackdrop').addEventListener('click', (e) => {
      if (e.target.id === 'winnerModalBackdrop') saveWinnerAndCloseModal();
    });

    document.getElementById('openSettingsBtn').addEventListener('click', openSettingsModal);
    document.getElementById('cloudSyncPill').addEventListener('click', openSettingsModal);
    document.getElementById('closeSettingsCrossBtn').addEventListener('click', () => {
      document.getElementById('settingsModalBackdrop').classList.remove('active');
    });
    document.getElementById('cancelSettingsBtn').addEventListener('click', () => {
      document.getElementById('settingsModalBackdrop').classList.remove('active');
    });

    document.getElementById('forcePullCloudBtn').addEventListener('click', async () => {
      const newRoom = document.getElementById('inputCloudRoom').value.trim() || DEFAULT_CLOUD_ROOM;
      state.cloudRoom = newRoom;
      connectCloudWebSocket();
      await pullStateFromCloud(true);
      alert('已從雲端同步最新資料！');
    });

    document.getElementById('addPrizeRowBtn').addEventListener('click', () => {
      appendPrizeEditorRow('', 1);
      updateAllocationSummary();
    });

    document.getElementById('inputTotalCells').addEventListener('input', updateAllocationSummary);
    document.getElementById('saveSettingsBtn').addEventListener('click', saveSettingsAndStart);

    // 開啟下一局（將本局整局封存保留，並產生新一局的紀錄）
    document.getElementById('resetBoardBtn').addEventListener('click', () => {
      const openedCount = state.cells.filter(c => c.opened).length;
      const msg = openedCount > 0
        ? `確定要結束目前「第 ${state.roundNumber} 局」並開啟下一局嗎？\n（第 ${state.roundNumber} 局的整局結果會完整保留在「各局遊玩紀錄」分頁中）`
        : `目前第 ${state.roundNumber} 局尚未開啟任何格子，確定要重新洗牌嗎？`;
      if (confirm(msg)) {
        startNewRoundSession(state.config, false);
      }
    });

    document.getElementById('soundToggleBtn').addEventListener('click', () => {
      state.soundEnabled = !state.soundEnabled;
      updateSoundButton();
      saveLocalState();
    });

    function handleCallNumber() {
      const input = document.getElementById('callNumberInput');
      const num = parseInt(input.value, 10);
      if (!num) {
        alert('請先輸入要開啟的格子號碼！');
        return;
      }
      input.value = '';
      triggerOpenCell(num);
    }

    document.getElementById('callNumberBtn').addEventListener('click', handleCallNumber);
    document.getElementById('callNumberInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleCallNumber();
    });

    document.getElementById('randomPickBtn').addEventListener('click', startRouletteRandomPick);

    document.getElementById('recordSearchInput').addEventListener('input', renderSessionsView);
    document.getElementById('exportCsvBtn').addEventListener('click', exportRecordsToCsv);
    document.getElementById('clearAllRecordsBtn').addEventListener('click', () => {
      if (state.gameSessions.length <= 1 && state.cells.every(c => !c.opened)) {
        alert('目前沒有已封存的歷史局數可清空！');
        return;
      }
      if (confirm('⚠️ 確定要刪除所有歷史局數紀錄，並重置回「第 1 局」嗎？\n此操作會同步刪除雲端上的歷史局數且無法復原！')) {
        state.gameSessions = [];
        state.roundNumber = 1;
        state.currentSessionId = '';
        expandedSessionIds.clear();
        startNewRoundSession(state.config, true);
      }
    });

    loadInitialState();
  </script>
</body>
</html>
